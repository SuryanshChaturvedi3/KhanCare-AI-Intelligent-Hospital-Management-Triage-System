# ============================================
# Nginx Configuration for React SPA
# ============================================
# WHY do we need this?
# React uses client-side routing (React Router).
# When user visits /dashboard, there's no actual /dashboard file on server.
# Without this config, Nginx returns 404.
# With this config: "If file not found, serve index.html" → React Router handles the route.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) for 1 year
    # WHY? Vite adds content hashes to filenames (app-abc123.js)
    # If content changes, filename changes → browser fetches new version
    # So it's safe to cache forever = faster page loads for users
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html (so users always get latest version)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
